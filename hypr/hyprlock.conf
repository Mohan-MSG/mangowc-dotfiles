# BACKGROUND
background {
    monitor =
    path = ~/dotfiles/wallpapers/Goku.jpg
    # blur_passes = 3
    # blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# SIDEBAR PANEL
shape {
    monitor =
    size = 600, 70%
    color = rgba(0, 0, 0, 0.5) # Mocha Crust/Base mix
    rounding = 0
    border_size = 0
    position = -100, 0
    halign = right
    valign = center
}

# TIME (Top Left)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M:%S %p")</span>"
    color = rgba(205, 214, 244, 1.0) # Text
    font_size = 60
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = -120, -200
    halign = right
    valign = top
}

# DAY/DATE
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%A")</span>"
    color = rgba(203, 166, 247, 1.0) # Mauve
    font_size = 35
    font_family = JetBrainsMono Nerd Font Bold
    position = -120, -300
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%d %B %Y")</span>"
    color = rgba(166, 227, 161, 0.6) # Green
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -120, -370
    halign = right
    valign = top
}

