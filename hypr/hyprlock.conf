# USER INFO
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(205, 214, 244, 0.7)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -190, 260
    halign = right
    valign = bottom
}

# INPUT FIELD (Bottom Left)
input-field {
    monitor =
    size = 350, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(203, 166, 247, 0)
    inner_color = rgba(30, 30, 46, 0.5)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    rounding = 10
    placeholder_text = <span foreground="##cdd6f488">  Password</span>
    hide_input = false
    position = -120, 190
    halign = right
    valign = bottom
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
}

# BATTERY (Bottom Right of Sidebar)
label {
    monitor =
    text = cmd[update:1000] echo -e "$(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(147, 153, 178, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 50, 20
    halign = left
    valign = bottom
}
